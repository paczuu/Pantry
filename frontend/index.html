    <script>
      (function () {
        try {
          var allowedThemes = [
            'emerald',
            'blue',
            'violet',
            'rose',
            'amber',
            'cyan'
          ];

          var savedTheme = localStorage.getItem('spizarnia_accent_theme');

          if (!savedTheme || allowedThemes.indexOf(savedTheme) === -1) {
            savedTheme = 'emerald';
          }

          document.documentElement.setAttribute(
            'data-accent-theme',
            savedTheme
          );

          var themeColors = {
            emerald: '#10b981',
            blue: '#3b82f6',
            violet: '#8b5cf6',
            rose: '#f43f5e',
            amber: '#f59e0b',
            cyan: '#06b6d4'
          };

          var themeMeta = document.querySelector(
            'meta[name="theme-color"]'
          );

          if (themeMeta) {
            themeMeta.setAttribute(
              'content',
              themeColors[savedTheme] || themeColors.emerald
            );
          }
        } catch (error) {
          document.documentElement.setAttribute(
            'data-accent-theme',
            'emerald'
          );
        }
      })();
    </script>
