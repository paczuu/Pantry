# Pantry — install from the pre-built images (nothing is built on your machine).
#
#   curl -O https://raw.githubusercontent.com/paczuu/Pantry/main/docker-compose.ghcr.yml
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Optional settings (put them in a .env file next to this one):
#   PANTRY_VERSION  image tag to run, e.g. 0.5.0 (default: latest)
#   PANTRY_PORT     port of the web app (default: 3200)
#   JWT_SECRET      leave empty: a random secret is generated on first start and stored in ./data

name: pantry

services:
  backend:
    image: ghcr.io/paczuu/pantry-backend:${PANTRY_VERSION:-latest}
    container_name: pantry-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: file:/app/data/pantry.db
      JWT_SECRET: ${JWT_SECRET:-}
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    expose:
      - "3001"

  frontend:
    image: ghcr.io/paczuu/pantry-frontend:${PANTRY_VERSION:-latest}
    container_name: pantry-frontend
    restart: unless-stopped
    ports:
      - "${PANTRY_PORT:-3200}:80"
    depends_on:
      - backend
