name: Release

# Publishes the Docker images and creates a GitHub release when a version tag is pushed (e.g. v0.5.0).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pantry-backend
            context: ./backend
          - name: pantry-frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      # arm64 covers Raspberry Pi and ARM NAS devices
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: Create GitHub release
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          ## Install with Docker

          \`\`\`bash
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/${TAG}/docker-compose.ghcr.yml
          docker compose -f docker-compose.ghcr.yml up -d
          \`\`\`

          Open http://localhost:3200 and register the first account. Images: \`ghcr.io/${{ github.repository_owner }}/pantry-backend:${TAG#v}\` and \`ghcr.io/${{ github.repository_owner }}/pantry-frontend:${TAG#v}\` (amd64 and arm64).
          EOF
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --generate-notes
